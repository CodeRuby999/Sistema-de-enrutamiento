<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Candidatos - Enrutamiento</title>
    <!-- Font Awesome para iconos profesionales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        /* Modo oscuro */
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.dark-mode .search-card,
        body.dark-mode .producto-card,
        body.dark-mode .candidatos-section {
            background: #0f3460;
            color: #e0e0e0;
        }

        body.dark-mode label,
        body.dark-mode .info-label,
        body.dark-mode .candidato-info-label {
            color: #b0b0b0;
        }

        body.dark-mode .info-value,
        body.dark-mode .info-item {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        body.dark-mode .candidato-card {
            background: #1a1a2e;
            border-left-color: #4db8ff;
        }

        body.dark-mode .candidato-direccion {
            background: rgba(77, 184, 255, 0.1);
            color: #e0e0e0;
        }

        body.dark-mode .candidato-direccion strong {
            color: #4db8ff;
        }

        body.dark-mode .candidato-info-item {
            background: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .candidato-info-label {
            color: #b0b0b0;
        }

        body.dark-mode .candidato-info-value {
            color: #e0e0e0;
        }

        body.dark-mode input[type="number"] {
            background: #1a1a2e;
            color: #e0e0e0;
            border-color: #4db8ff;
        }

        body.dark-mode .candidato-numero,
        body.dark-mode .producto-card h2,
        body.dark-mode .candidatos-section h2 {
            color: #4db8ff;
        }


        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-search {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .btn-search:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #f44;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .producto-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .producto-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-size: 1rem;
        }

        .candidatos-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .candidatos-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .candidato-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .candidato-card:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .candidato-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .candidato-numero {
            font-size: 1.2rem;
            font-weight: 700;
            color: #667eea;
        }

        .candidato-tipo {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .candidato-tipo.anterior {
            background: #f59e0b;
        }

        .candidato-tipo.posterior {
            background: #10b981;
        }

        .candidato-direccion {
            background: rgba(102, 126, 234, 0.05);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1rem;
            color: #333;
        }

        .candidato-direccion strong {
            color: #667eea;
            margin-right: 8px;
        }

        .candidato-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .candidato-info-item {
            background: rgba(0, 0, 0, 0.02);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .candidato-info-label {
            font-weight: 600;
            color: #666;
            margin-right: 10px;
        }

        .candidato-info-value {
            color: #333;
            font-weight: 500;
            flex: 1;
            text-align: right;
            margin-right: 8px;
        }

        .candidato-copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 8px;
            transition: all 0.2s;
        }

        .candidato-copy-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .candidato-copy-btn.copied {
            background: #10b981;
        }

        .recomendacion-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            color: white;
        }

        .recomendacion-card h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recomendacion-info {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .recomendacion-item {
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .recomendacion-label {
            font-weight: 600;
            opacity: 0.9;
        }

        .recomendacion-value {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-left: 10px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: white;
            transform: translateY(-2px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: rgba(16, 185, 129, 0.8);
            border-color: #10b981;
        }

        .recomendacion-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .candidato-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .candidato-info {
                grid-template-columns: 1fr;
            }

            .candidato-info-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .candidato-info-value {
                text-align: left;
                margin-right: 0;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container">
        <div class="header">
            <h1><i></i> Sistema de Enrutamiento</h1>
            <p>Búsqueda de Candidatos por Dirección</p>
        </div>

        <div class="search-card">
            <div class="form-group">
                <label for="productId">PRODUCT_ID:</label>
                <input type="number" id="productId" placeholder="Ingrese el PRODUCT_ID" required>
            </div>
            <button class="btn-search" onclick="buscarCandidatos()">
                <i class="fas fa-search"></i> Buscar Candidatos
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: white; font-weight: 600;">Buscando...</p>
        </div>

        <div class="results" id="results">
            <!-- Producto encontrado -->
            <div class="producto-card">
                <h2><i class="fas fa-check-circle"></i> Producto Encontrado</h2>
                <div class="info-grid" id="productoInfo"></div>
            </div>

            <!-- Mensaje de error (si no hay candidatos) -->
            <div class="error-message" id="errorMessage"></div>

            <!-- Candidatos -->
            <div class="candidatos-section" id="candidatosSection">
                <h2><i class="fas fa-users"></i> Vecinos y Candidatos Cercanos</h2>
                <div id="candidatosList"></div>
            </div>

            <!-- Recomendación -->
            <div class="recomendacion-card" id="recomendacionCard">
                <h2><i class="fas fa-star"></i> Recomendación</h2>
                <div class="recomendacion-info" id="recomendacionInfo"></div>
            </div>
        </div>
    </div>

    <script>
        // ========== BÚSQUEDA DE CANDIDATOS ==========
        async function buscarCandidatos() {
            const productId = document.getElementById('productId').value;
            
            if (!productId) {
                mostrarError('Por favor ingrese un PRODUCT_ID');
                return;
            }

            // Ocultar resultados previos y errores
            document.getElementById('results').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');
            
            // Mostrar loading
            document.getElementById('loading').style.display = 'block';
            document.querySelector('.btn-search').disabled = true;

            try {
                const response = await fetch('/buscar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ product_id: productId })
                });

                const data = await response.json();

                // Ocultar loading
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.btn-search').disabled = false;

                if (!data.encontrado) {
                    mostrarError(data.error || 'No se encontraron resultados');
                    return;
                }

                // Si se encontró el producto pero hay un error (sin candidatos), mostrar producto y error
                if (data.error && data.producto) {
                    mostrarResultados(data);
                    mostrarError(data.error);
                } else {
                    mostrarResultados(data);
                }

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.btn-search').disabled = false;
                mostrarError('Error al conectar con el servidor: ' + error.message);
            }
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + mensaje;
            errorDiv.classList.add('show');
        }

        function mostrarResultados(data) {
            // Mostrar la sección de resultados primero
            document.getElementById('results').classList.add('show');
            
            // Mostrar información del producto
            const productoInfo = document.getElementById('productoInfo');
            productoInfo.innerHTML = `
                <div class="info-item">
                    <div class="info-label">PRODUCT_ID</div>
                    <div class="info-value">${data.producto.PRODUCT_ID || 'N/A'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">DPTO</div>
                    <div class="info-value">${data.producto.DPTO}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">MUNICIPIO</div>
                    <div class="info-value">${data.producto.MUNICIPIO}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">LOCALIDAD</div>
                    <div class="info-value">${data.producto.LOCALIDAD}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">DIRECCIÓN</div>
                    <div class="info-value">${data.producto.DIRECCION}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">ROUTE_ID Actual</div>
                    <div class="info-value">${data.producto.ROUTE_ID || 'None'}</div>
                </div>
            `;

            // Mostrar candidatos
            if (data.candidatos && data.candidatos.length > 0) {
                const candidatosList = document.getElementById('candidatosList');
                candidatosList.innerHTML = data.candidatos.map((candidato, index) => `
                    <div class="candidato-card">
                        <div class="candidato-header">
                            <span class="candidato-numero">${index + 1}. PRODUCT_ID: ${candidato.PRODUCT_ID}</span>
                            ${candidato.tipo_candidato ? `<span class="candidato-tipo ${candidato.tipo_candidato.includes('anterior') ? 'anterior' : 'posterior'}">${candidato.tipo_candidato}</span>` : ''}
                        </div>
                        
                        <div class="candidato-direccion">
                            <strong><i class="fas fa-map-marker-alt"></i> Dirección:</strong> ${candidato.DIRECCION}
                        </div>
                        
                        <div class="candidato-info">
                            <div class="candidato-info-item">
                                <span class="candidato-info-label">ROUTE_ID:</span>
                                <span class="candidato-info-value">${candidato.ROUTE_ID}</span>
                                <button class="candidato-copy-btn" onclick="copiarTexto('${candidato.ROUTE_ID}', this)"><i class="fas fa-copy"></i></button>
                            </div>
                            <div class="candidato-info-item">
                                <span class="candidato-info-label">ITINERARIO:</span>
                                <span class="candidato-info-value">${candidato.ITINERARIO}</span>
                                <button class="candidato-copy-btn" onclick="copiarTexto('${candidato.ITINERARIO}', this)"><i class="fas fa-copy"></i></button>
                            </div>
                            <div class="candidato-info-item">
                                <span class="candidato-info-label">SECUENCIA:</span>
                                <span class="candidato-info-value">${candidato.SECUENCIA}</span>
                                <button class="candidato-copy-btn" onclick="copiarTexto('${candidato.SECUENCIA}', this)"><i class="fas fa-copy"></i></button>
                            </div>
                            <div class="candidato-info-item">
                                <span class="candidato-info-label">Ciclo:</span>
                                <span class="candidato-info-value">${candidato.CICLO}</span>
                                <button class="candidato-copy-btn" onclick="copiarTexto('${candidato.CICLO}', this)"><i class="fas fa-copy"></i></button>
                            </div>
                            ${candidato.diferencia_puerta !== null ? `
                            <div class="candidato-info-item" style="grid-column: 1 / -1; background: rgba(102, 126, 234, 0.1);">
                                <span class="candidato-info-label"><i class="fas fa-ruler-horizontal"></i> Diferencia:</span>
                                <span class="candidato-info-value" style="color: #667eea; font-weight: 700;">${candidato.diferencia_puerta} ${candidato.diferencia_puerta === 1 ? 'metro' : 'metros'}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `).join('');

                // Mostrar mensajes informativos sobre vecinos no encontrados
                if (data.vecinos_info && data.vecinos_info.mensajes && data.vecinos_info.mensajes.length > 0) {
                    const mensajesHtml = data.vecinos_info.mensajes.map(msg => 
                        `<div style="background: rgba(255, 193, 7, 0.1); border-left: 3px solid #ffc107; padding: 10px; margin-top: 15px; border-radius: 5px;">
                            <i class="fas fa-info-circle" style="color: #ffc107; margin-right: 8px;"></i>
                            <span style="color: #856404;">${msg}</span>
                        </div>`
                    ).join('');
                    candidatosList.innerHTML += mensajesHtml;
                }

                document.getElementById('candidatosSection').style.display = 'block';
            } else {
                document.getElementById('candidatosSection').style.display = 'none';
            }

            // Mostrar análisis de itinerarios
            if (data.itinerarios_info && data.itinerarios_info.total_unicos > 0) {
                const itinerariosHtml = `
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; padding: 20px; margin-top: 20px; color: white;">
                        <h3 style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-chart-bar"></i> Análisis de Itinerarios
                        </h3>
                        <div style="background: rgba(255,255,255,0.15); border-radius: 8px; padding: 15px; backdrop-filter: blur(10px);">
                            <div style="margin-bottom: 15px; font-size: 1.1rem;">
                                <strong>Total de itinerarios únicos:</strong> ${data.itinerarios_info.total_unicos}
                            </div>
                            <div style="font-weight: 600; margin-bottom: 10px;">Distribución:</div>
                            ${data.itinerarios_info.detalle.map(item => `
                                <div style="background: rgba(255,255,255,0.1); padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;">
                                    <span><i class="fas fa-route" style="margin-right: 8px;"></i>Itinerario: <strong>${item.itinerario}</strong></span>
                                    <span style="background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-weight: bold;">${item.cantidad} ${item.cantidad === 1 ? 'candidato' : 'candidatos'}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                candidatosList.innerHTML += itinerariosHtml;
            }

            // Mostrar recomendación
            if (data.recomendacion) {
                const recomendacionInfo = document.getElementById('recomendacionInfo');
                recomendacionInfo.innerHTML = `
                    <div class="recomendacion-item">
                        <div class="recomendacion-label">Dirección:</div>
                        <div class="recomendacion-value">${data.recomendacion.DIRECCION}</div>
                    </div>
                    ${data.recomendacion.diferencia_puerta !== null ? `
                    <div class="recomendacion-item">
                        <div class="recomendacion-label">Distancia:</div>
                        <div class="recomendacion-value">${data.recomendacion.diferencia_puerta} ${data.recomendacion.diferencia_puerta === 1 ? 'metro' : 'metros'} de la dirección buscada</div>
                    </div>
                    ` : ''}
                    <div class="recomendacion-item">
                        <div class="recomendacion-row">
                            <div>
                                <div class="recomendacion-label">ROUTE_ID:</div>
                                <div class="recomendacion-value">${data.recomendacion.ROUTE_ID}</div>
                            </div>
                            <button class="copy-btn" onclick="copiarTexto('${data.recomendacion.ROUTE_ID}', this)">
                                <i class="fas fa-copy"></i> Copiar
                            </button>
                        </div>
                    </div>
                    <div class="recomendacion-item">
                        <div class="recomendacion-row">
                            <div>
                                <div class="recomendacion-label">ITINERARIO:</div>
                                <div class="recomendacion-value">${data.recomendacion.ITINERARIO}</div>
                            </div>
                            <button class="copy-btn" onclick="copiarTexto('${data.recomendacion.ITINERARIO}', this)">
                                <i class="fas fa-copy"></i> Copiar
                            </button>
                        </div>
                    </div>
                    <div class="recomendacion-item">
                        <div class="recomendacion-row">
                            <div>
                                <div class="recomendacion-label">SECUENCIA:</div>
                                <div class="recomendacion-value">${data.recomendacion.SECUENCIA}</div>
                            </div>
                            <button class="copy-btn" onclick="copiarTexto('${data.recomendacion.SECUENCIA}', this)">
                                <i class="fas fa-copy"></i> Copiar
                            </button>
                        </div>
                    </div>
                    <div class="recomendacion-item">
                        <div class="recomendacion-row">
                            <div>
                                <div class="recomendacion-label">Ciclo:</div>
                                <div class="recomendacion-value">${data.recomendacion.CICLO}</div>
                            </div>
                            <button class="copy-btn" onclick="copiarTexto('${data.recomendacion.CICLO}', this)">
                                <i class="fas fa-copy"></i> Copiar
                            </button>
                        </div>
                    </div>
                `;
                document.getElementById('recomendacionCard').style.display = 'block';
            } else {
                document.getElementById('recomendacionCard').style.display = 'none';
            }
        }

        // Función para copiar texto al portapapeles
        async function copiarTexto(texto, boton) {
            try {
                await navigator.clipboard.writeText(texto);
                
                // Cambiar el icono del botón temporalmente
                const iconoOriginal = boton.innerHTML;
                const esBotonPequeno = boton.classList.contains('candidato-copy-btn');
                
                if (esBotonPequeno) {
                    boton.innerHTML = '<i class="fas fa-check"></i>';
                } else {
                    boton.innerHTML = '<i class="fas fa-check"></i> Copiado';
                }
                
                boton.classList.add('copied');
                
                // Restaurar después de 2 segundos
                setTimeout(() => {
                    boton.innerHTML = iconoOriginal;
                    boton.classList.remove('copied');
                }, 2000);
            } catch (err) {
                // Fallback para navegadores antiguos
                const textArea = document.createElement('textarea');
                textArea.value = texto;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                document.body.appendChild(textArea);
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    const esBotonPequeno = boton.classList.contains('candidato-copy-btn');
                    
                    if (esBotonPequeno) {
                        boton.innerHTML = '<i class="fas fa-check"></i>';
                    } else {
                        boton.innerHTML = '<i class="fas fa-check"></i> Copiado';
                    }
                    
                    boton.classList.add('copied');
                    
                    setTimeout(() => {
                        boton.innerHTML = esBotonPequeno ? '<i class="fas fa-copy"></i>' : '<i class="fas fa-copy"></i> Copiar';
                        boton.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    alert('Error al copiar: ' + err);
                } finally {
                    document.body.removeChild(textArea);
                }
            }
        }

        // Permitir buscar con Enter
        document.getElementById('productId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarCandidatos();
            }
        });
    </script>
</body>
</html>
